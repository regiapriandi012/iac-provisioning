[defaults]
# HYPER-PERFORMANCE SETTINGS
host_key_checking = False
inventory = ../scripts/inventory.py
remote_user = root
retry_files_enabled = False
gathering = explicit
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts_hyper
fact_caching_timeout = 7200
stdout_callback = yaml
callbacks_enabled = timer, profile_tasks, profile_roles
interpreter_python = auto_silent

# ULTRA-PERFORMANCE strategy
strategy = free
timeout = 10
ansible_python_interpreter = /usr/bin/python3

# MAXIMUM PARALLELISM
forks = 200
pipelining = True

# ASYNC OPTIMIZATION  
poll_interval = 0.3
callback_whitelist = profile_tasks, timer

# Mitogen for ultra-fast performance
strategy_plugins = plugins/strategy
library = plugins/mitogen_lib

# HYPER-OPTIMIZED SSH settings
[ssh_connection]
# Ultra-fast SSH with aggressive timeouts
ssh_args = -C -o ControlMaster=auto -o ControlPersist=3600s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=3 -o ServerAliveInterval=30 -o ServerAliveCountMax=2 -o Compression=no
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
pipelining = True
retries = 1

# HYPER-PERFORMANCE inventory caching
[inventory]
cache = True
cache_timeout = 7200

# Performance profiling
[callback_profile_tasks]
sort_order = descending
add_host_to_task = True

# Connection pooling optimization
[persistent_connection]
command_timeout = 10
connect_timeout = 5