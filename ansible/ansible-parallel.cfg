[defaults]
# Extreme Parallelization Settings for Maximum Speed
host_key_checking = False
gathering = smart
fact_caching = memory
fact_caching_timeout = 86400

# Maximum parallel execution - ULTRA PERFORMANCE
forks = 100
serial = 0

# Connection optimizations - FASTER
timeout = 60
command_timeout = 120
connect_timeout = 10

# SSH optimizations - ULTRA FAST CONNECTIONS
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o Compression=no -o TCPKeepAlive=yes -o ControlPath=~/.ssh/ansible-%r@%h:%p
pipelining = True
ssh_executable = /usr/bin/ssh

# Performance optimizations
callback_whitelist = profile_tasks, timer
stdout_callback = yaml

# Strategy plugins for parallel execution
strategy_plugins = /usr/local/lib/python3.*/site-packages/ansible/plugins/strategy
strategy = free

# Reduce logging overhead for speed
log_path = /tmp/ansible-parallel.log
display_skipped_hosts = False
display_ok_hosts = False

# Async settings
poll_interval = 1
async_timeout = 7200

# Retry settings
retry_files_enabled = False

# Inventory optimizations
inventory_cache = True
inventory_cache_timeout = 3600

# Mitogen optimizations (if installed)
[inventory]
cache = True
cache_plugin = memory
cache_timeout = 3600

[ssh_connection]
# SSH connection pooling
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
control_path_dir = /tmp/.ansible-cp
control_path = %(directory)s/%%h-%%p-%%r
pipelining = True
retries = 3