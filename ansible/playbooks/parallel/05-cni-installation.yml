---
# Phase 5: CNI Installation (Only on first master, but optimized for speed)
- name: "🌐 Parallel CNI Installation - Phase 5"
  hosts: k8s_masters[0]
  become: true
  gather_facts: true
  
  vars:
    temp_dir: "/tmp/k8s-setup"
    
  pre_tasks:
    - name: Start timer
      set_fact:
        phase_start_time: "{{ ansible_date_time.epoch }}"
    
    - name: Check if CNI is already installed
      shell: kubectl get pods -n kube-system | grep -E "(cilium|flannel|calico|weave)" | wc -l
      register: cni_installed
      ignore_errors: true

    # Cilium CNI Installation - ULTRA FAST & RELIABLE
    - name: Install Cilium CLI - FIXED VERSION FOR RELIABILITY
      shell: |
        echo "🚀 Installing Cilium CLI with FIXED version for speed and reliability..."
        # Use specific tested version to avoid version resolution delays
        CILIUM_CLI_VERSION="v0.15.22"
        CLI_ARCH=amd64
        if [ "$(uname -m)" = "aarch64" ]; then CLI_ARCH=arm64; fi
        
        # Fast download without checksum to speed up
        curl -L --fail --connect-timeout 10 --max-time 60 \
          https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-${CLI_ARCH}.tar.gz \
          -o cilium.tar.gz
        tar xzf cilium.tar.gz -C /usr/local/bin
        chmod +x /usr/local/bin/cilium
        rm -f cilium.tar.gz
        
        # Quick verify
        /usr/local/bin/cilium version --client || echo "Warning: cilium CLI may not be fully ready"
        echo "✅ Cilium CLI installed successfully"
      when: 
        - cni_installed.stdout == "0"
        - cni_type == "cilium"
      async: 60  # Reduced timeout
      poll: 0
      register: cilium_cli_job

    # FIXED: Better wait mechanism with shorter retries
    - name: Wait for Cilium CLI installation - FIXED ASYNC
      async_status:
        jid: "{{ cilium_cli_job.ansible_job_id }}"
      register: cilium_cli_result
      until: cilium_cli_result.finished
      retries: 30  # Reduced from 60
      delay: 2
      when: cilium_cli_job is defined and cilium_cli_job.ansible_job_id is defined

    - name: Install Cilium CNI - ULTRA FAST & MINIMAL CONFIG
      shell: |
        echo "🌐 Installing Cilium CNI with minimal config for ULTRA SPEED..."
        /usr/local/bin/cilium install \
          --version {{ cni_version }} \
          --set operator.replicas=1 \
          --set config.ipam=kubernetes \
          --set hubble.relay.enabled=false \
          --set hubble.ui.enabled=false \
          --set kubeProxyReplacement=disabled \
          --set cluster.name={{ ansible_hostname }} \
          --set ipv4NativeRoutingCIDR={{ pod_network_cidr }} \
          --wait=false
        echo "✅ Cilium CNI installation triggered"
      when: 
        - cni_installed.stdout == "0"
        - cni_type == "cilium"
        - cilium_cli_result is defined and cilium_cli_result.finished
      async: 120  # Reduced timeout
      poll: 0
      register: cilium_install_job

    # Flannel CNI Installation (Lightweight and fast)
    - name: Install Flannel CNI
      shell: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
      when: 
        - cni_installed.stdout == "0"
        - cni_type == "flannel"
      async: 60
      poll: 0
      register: flannel_install_job

    # Calico CNI Installation
    - name: Install Calico CNI
      shell: kubectl create -f https://raw.githubusercontent.com/projectcalico/calico/v{{ cni_version }}/manifests/tigera-operator.yaml
      when: 
        - cni_installed.stdout == "0"
        - cni_type == "calico"
      async: 60
      poll: 0
      register: calico_operator_job

    - name: Create Calico custom resource
      shell: |
        cat <<EOF | kubectl create -f -
        apiVersion: operator.tigera.io/v1
        kind: Installation
        metadata:
          name: default
        spec:
          calicoNetwork:
            ipPools:
            - blockSize: 26
              cidr: {{ pod_network_cidr }}
              encapsulation: VXLANCrossSubnet
              natOutgoing: Enabled
              nodeSelector: all()
        EOF
      when: 
        - cni_installed.stdout == "0"
        - cni_type == "calico"
      async: 60
      poll: 0
      register: calico_config_job

    # Weave Net CNI Installation
    - name: Install Weave Net CNI
      shell: kubectl apply -f https://github.com/weaveworks/weave/releases/download/v{{ cni_version }}/weave-daemonset-k8s.yaml
      when: 
        - cni_installed.stdout == "0"
        - cni_type == "weave"
      async: 60
      poll: 0
      register: weave_install_job

    # FIXED: Wait for installations with PROPER error handling
    - name: Wait for Cilium CNI installation - FIXED ASYNC MECHANISM
      async_status:
        jid: "{{ cilium_install_job.ansible_job_id }}"
      register: cilium_install_result
      until: cilium_install_result.finished
      retries: 60  # Reduced retries but with better error handling
      delay: 2
      when: cilium_install_job is defined and cilium_install_job.ansible_job_id is defined
      ignore_errors: yes  # Don't fail entire deployment if CNI install has issues

    - name: Wait for Flannel installation
      async_status:
        jid: "{{ flannel_install_job.ansible_job_id }}"
      register: flannel_install_result
      until: flannel_install_result.finished
      retries: 30
      delay: 2
      when: flannel_install_job is defined and flannel_install_job.ansible_job_id is defined

    - name: Wait for Calico operator installation
      async_status:
        jid: "{{ calico_operator_job.ansible_job_id }}"
      register: calico_operator_result
      until: calico_operator_result.finished
      retries: 30
      delay: 2
      when: calico_operator_job is defined and calico_operator_job.ansible_job_id is defined

    - name: Wait for Calico configuration
      async_status:
        jid: "{{ calico_config_job.ansible_job_id }}"
      register: calico_config_result
      until: calico_config_result.finished
      retries: 30
      delay: 2
      when: calico_config_job is defined and calico_config_job.ansible_job_id is defined

    - name: Wait for Weave installation
      async_status:
        jid: "{{ weave_install_job.ansible_job_id }}"
      register: weave_install_result
      until: weave_install_result.finished
      retries: 30
      delay: 2
      when: weave_install_job is defined and weave_install_job.ansible_job_id is defined

    # ULTRA FAST: Replace slow cilium status check with kubectl check
    - name: Fast CNI readiness check - SIMPLIFIED & RELIABLE  
      shell: |
        echo "🚀 Ultra-fast CNI readiness check..."
        # Wait for CNI pods to be running instead of cilium status
        timeout 60 bash -c '
        while [ $(kubectl get pods -n kube-system -l k8s-app=cilium --no-headers | grep Running | wc -l) -lt 1 ]; do
          echo "Waiting for Cilium pods..."
          sleep 3
        done
        echo "✅ Cilium pods are running!"
        '
      when: 
        - cni_installed.stdout == "0"
        - cni_type == "cilium"
        - cilium_install_result is defined
      async: 90  # Much shorter timeout
      poll: 3   # Faster polling
      ignore_errors: yes

    # Generic wait for CNI pods to be ready (parallel check)
    - name: Wait for CNI pods to be ready
      shell: kubectl get pods -n kube-system | grep -E "(cilium|flannel|calico|weave)" | grep -v Running | wc -l
      register: cni_pods_not_ready
      until: cni_pods_not_ready.stdout == "0"
      retries: 60
      delay: 5
      when: cni_installed.stdout == "0"

    # ULTRA FAST: Simplified node readiness check
    - name: Fast node readiness check - FINAL STEP
      shell: |
        echo "🎯 Final ultra-fast node readiness check..."
        timeout 60 bash -c '
        while [ $(kubectl get nodes --no-headers | grep -c Ready) -lt 1 ]; do
          echo "Waiting for at least 1 node to be Ready..."
          sleep 3
        done
        echo "✅ Nodes are ready!"
        '
      async: 90
      poll: 3
      ignore_errors: yes

  post_tasks:
    - name: Calculate phase duration
      set_fact:
        phase_end_time: "{{ ansible_date_time.epoch }}"
        phase_duration: "{{ ansible_date_time.epoch | int - phase_start_time | int }}"

