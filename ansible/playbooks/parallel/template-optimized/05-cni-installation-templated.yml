---
# Template-Optimized CNI Installation - Phase 5
# This playbook detects pre-baked templates and leverages pre-pulled CNI images
- name: "🌐 Template-Optimized CNI (Cilium) Installation - Phase 5"
  hosts: k8s_masters[0]
  become: true
  gather_facts: true
  
  vars:
    temp_dir: "/tmp/k8s-setup"
    
  pre_tasks:
    - name: Start timer
      set_fact:
        phase_start_time: "{{ ansible_date_time.epoch }}"
    
    # TEMPLATE DETECTION LOGIC
    - name: Check if VM is from K8s-ready template
      stat:
        path: /etc/kubernetes-template-info
      register: template_marker

    - name: Read template information if exists
      slurp:
        src: /etc/kubernetes-template-info
      register: template_info_content
      when: template_marker.stat.exists

    - name: Parse template information
      set_fact:
        is_k8s_ready_template: "{{ template_marker.stat.exists }}"
        template_name: "{{ VM_TEMPLATE | default('unknown') }}"
        template_cilium_version: "{{ '1.16.0' if template_marker.stat.exists else 'unknown' }}"

    - name: Check if cluster is ready for CNI
      shell: kubectl get nodes --no-headers 2>/dev/null | wc -l
      register: node_count
      changed_when: false
      ignore_errors: yes

    - name: Check pre-pulled CNI images status (template-aware)
      shell: |
        echo "🔍 Checking for Cilium v{{ cni_version }} images from template..."
        # Check for exact template images as per prebaked scripts
        cilium_main=$(ctr images list -q | grep -E "quay.io/cilium/cilium:v{{ cni_version }}" | wc -l)
        cilium_operator=$(ctr images list -q | grep -E "quay.io/cilium/operator-generic:v{{ cni_version }}" | wc -l)
        utility_images=$(ctr images list -q | grep -E '(busybox|alpine):latest' | wc -l)
        
        echo "Found Cilium main images (quay.io/cilium/cilium:v{{ cni_version }}): $cilium_main"
        echo "Found Cilium operator images (quay.io/cilium/operator-generic:v{{ cni_version }}): $cilium_operator"  
        echo "Found utility images: $utility_images"
        
        echo "cilium_main:$cilium_main,cilium_operator:$cilium_operator,utility:$utility_images"
      register: cni_image_status
      changed_when: false
      timeout: 30

    - name: Parse CNI image status with template-specific logic
      set_fact:
        cilium_main_images: "{{ cni_image_status.stdout.split(',')[0].split(':')[1] | int }}"
        cilium_operator_images: "{{ cni_image_status.stdout.split(',')[1].split(':')[1] | int }}"
        utility_images: "{{ cni_image_status.stdout.split(',')[2].split(':')[1] | int }}"
        cni_images_pre_pulled: "{{ (cni_image_status.stdout.split(',')[0].split(':')[1] | int) >= 1 and (cni_image_status.stdout.split(',')[1].split(':')[1] | int) >= 1 }}"

    - name: Check if CNI is already installed
      shell: timeout 30 kubectl get pods -n kube-system --no-headers 2>/dev/null | grep -E '(cilium|cni)' | wc -l
      register: cni_pods_count
      changed_when: false
      ignore_errors: yes
      timeout: 45

    - name: CNI installation strategy
      debug:
        msg:
          - "🔍 CNI INSTALLATION STRATEGY:"
          - "  K8s-ready template: {{ is_k8s_ready_template }}"
          - "  Template Cilium version: {{ template_cilium_version }}"
          - "  Target Cilium version: {{ cni_version }}"
          - "  Cluster nodes ready: {{ node_count.stdout | int }}"
          - "  CNI already installed: {{ (cni_pods_count.stdout | int) > 0 }}"
          - "  Cilium main images (v{{ cni_version }}): {{ cilium_main_images }}"
          - "  Cilium operator images (v{{ cni_version }}): {{ cilium_operator_images }}"
          - "  Images pre-pulled for v{{ cni_version }}: {{ 'YES' if cni_images_pre_pulled else 'NO' }}"
          - "  Utility images available: {{ utility_images }}"
          - "  Strategy: {{ 'ULTRA-FAST CNI (skip image pull)' if (is_k8s_ready_template and cni_images_pre_pulled) else 'REGULAR CNI (with image pull)' }}"

  tasks:
    - name: Template CNI optimization notification
      debug:
        msg:
          - "⚡ CNI TEMPLATE OPTIMIZATION ACTIVE"
          - "  Using K8s-ready template with pre-pulled Cilium images"
          - "  Template Cilium version: {{ template_cilium_version }}"
          - "  Target Cilium version: {{ cni_version }}"
          - "  Skipping image pull phase for faster deployment"
          - "  Time saved: ~45-50 seconds"
      when: 
        - is_k8s_ready_template
        - cni_images_pre_pulled
        - (cni_pods_count.stdout | int) == 0

    - name: Regular VM CNI notification
      debug:
        msg:
          - "🔧 REGULAR VM OR INCOMPLETE TEMPLATE"
          - "  Running full CNI installation with image pulling..."
      when: not (is_k8s_ready_template and cni_images_pre_pulled)

    - name: Version mismatch warning
      debug:
        msg:
          - "⚠️  CILIUM VERSION MISMATCH DETECTED"
          - "  Template version: {{ template_cilium_version }}"
          - "  Required version: {{ cni_version }}"
          - "  Action: Will proceed with target version (may require image pull)"
      when: 
        - is_k8s_ready_template 
        - template_cilium_version != 'unknown'
        - template_cilium_version != cni_version

    # Skip installation if CNI is already installed
    - name: Check if CNI installation should be skipped
      set_fact:
        skip_cni_installation: "{{ (cni_pods_count.stdout | int) > 0 }}"

    - name: CNI already installed notification
      debug:
        msg:
          - "✅ CNI ALREADY INSTALLED"
          - "  Found {{ cni_pods_count.stdout }} CNI pods in kube-system namespace"
          - "  Skipping CNI installation completely"
      when: skip_cni_installation

    # CONDITIONAL CNI INSTALLATION (skip if already installed)

    # DEBUGGING: Show template variables before installation
    - name: Debug template variables for Cilium installation
      debug:
        msg:
          - "🔍 CILIUM INSTALLATION DEBUG:"
          - "  is_k8s_ready_template: {{ is_k8s_ready_template }}"
          - "  cni_images_pre_pulled: {{ cni_images_pre_pulled }}"
          - "  cni_version: {{ cni_version }}"
          - "  skip_cni_installation: {{ skip_cni_installation }}"
          - "  Template decision: {{ 'OPTIMIZED (pre-pulled images)' if (is_k8s_ready_template and cni_images_pre_pulled) else 'REGULAR (download images)' }}"
      when: not skip_cni_installation

    # RELIABLE CILIUM INSTALLATION VIA CLI (modern approach)
    - name: Install Cilium CLI
      shell: |
        echo "📦 Installing Cilium CLI..."
        CILIUM_CLI_VERSION="v0.16.20"
        CLI_ARCH=amd64
        if [ "$(uname -m)" = "aarch64" ]; then CLI_ARCH=arm64; fi
        
        curl -L --fail --connect-timeout 10 --max-time 60 \
          https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-${CLI_ARCH}.tar.gz \
          -o cilium.tar.gz
        tar xzf cilium.tar.gz -C /usr/local/bin
        chmod +x /usr/local/bin/cilium
        rm -f cilium.tar.gz
        
        echo "✅ Cilium CLI installed successfully"
      register: cilium_cli_install

    - name: Install Cilium CNI with template optimization
      shell: |
        echo "🚀 Installing Cilium v{{ cni_version }}..."
        echo "Template variables: is_k8s_ready={{ is_k8s_ready_template }}, images_pre_pulled={{ cni_images_pre_pulled }}"
        
        # Template optimization: use pre-pulled images if available
        if [ "{{ is_k8s_ready_template }}" = "True" ] && [ "{{ cni_images_pre_pulled }}" = "True" ]; then
          echo "⚡ Template optimization: Using pre-pulled images"
          cilium install \
            --version v{{ cni_version }} \
            --set image.pullPolicy=IfNotPresent \
            --set operator.image.pullPolicy=IfNotPresent \
            --wait
        else
          echo "🔧 Regular installation: Will pull images as needed"  
          cilium install \
            --version v{{ cni_version }} \
            --wait
        fi
        
        apply_result=$?
        
        if [ $apply_result -eq 0 ]; then
          echo "✅ Cilium installed successfully"
        else
          echo "❌ Cilium installation failed with exit code $apply_result"
          kubectl get events --sort-by=.metadata.creationTimestamp | tail -10
        fi
        
        # Wait a moment for pods to be created
        sleep 10
        
        # Verify installation
        echo "🔍 Checking Cilium installation status..."
        cilium_pod_count=$(kubectl get pods -n kube-system -l k8s-app=cilium --no-headers 2>/dev/null | wc -l)
        
        if [ "$cilium_pod_count" -gt 0 ]; then
          echo "✅ Found $cilium_pod_count Cilium pods"
          kubectl get pods -n kube-system -l k8s-app=cilium --no-headers
        else
          echo "⚠️ No Cilium pods found, checking all kube-system pods..."
          kubectl get pods -n kube-system --no-headers | grep cilium || echo "Still no Cilium pods visible"
        fi
        
        echo "✅ Cilium installation command completed"
      when: not skip_cni_installation
      register: cilium_install

    # VERIFICATION AND STATUS (YAML-based approach)
    - name: Wait for Cilium pods to be created (multiple attempts)
      shell: |
        echo "⏳ Waiting for Cilium pods to be created..."
        timeout 180 bash -c '
        attempt=0
        while [ $(kubectl get pods -n kube-system -l k8s-app=cilium --no-headers 2>/dev/null | wc -l) -eq 0 ]; do
          attempt=$((attempt + 1))
          echo "Waiting for Cilium pods to be created... (attempt $attempt)"
          
          # Show what pods exist in kube-system for debugging
          if [ $((attempt % 4)) -eq 0 ]; then
            echo "Current kube-system pods:"
            kubectl get pods -n kube-system --no-headers | head -5 || true
          fi
          
          sleep 5
        done
        echo "✅ Cilium pods have been created!"
        '
      when: not skip_cni_installation
      register: cilium_pods_wait
      ignore_errors: yes

    - name: Wait for Cilium pods to be ready (without CLI dependency)
      shell: |
        echo "⏳ Waiting for Cilium pods to become ready..."
        timeout 300 bash -c '
        while true; do
          # Check if all cilium pods are running
          running_pods=$(kubectl get pods -n kube-system -l k8s-app=cilium --no-headers 2>/dev/null | grep " Running " | wc -l)
          total_pods=$(kubectl get pods -n kube-system -l k8s-app=cilium --no-headers 2>/dev/null | wc -l)
          
          if [ "$total_pods" -gt 0 ] && [ "$running_pods" -eq "$total_pods" ]; then
            echo "✅ All Cilium pods are running ($running_pods/$total_pods)"
            break
          fi
          
          echo "Waiting for Cilium pods to become ready... ($running_pods/$total_pods running)"
          kubectl get pods -n kube-system -l k8s-app=cilium --no-headers || true
          sleep 10
        done
        '
      when: not skip_cni_installation
      register: cilium_ready_wait
      ignore_errors: yes

    - name: Verify all nodes are Ready after CNI installation
      shell: |
        echo "=== NODE STATUS VERIFICATION ==="
        kubectl get nodes -o wide
        echo ""
        echo "=== CNI POD STATUS ==="
        kubectl get pods -n kube-system -l k8s-app=cilium -o wide
        echo ""
        echo "=== ALL KUBE-SYSTEM PODS ==="
        kubectl get pods -n kube-system | grep -E "(cilium|cni)" || echo "No CNI pods found with cilium/cni label"
        echo ""
        echo "=== CILIUM DAEMONSET STATUS ==="
        kubectl get daemonset -n kube-system -l k8s-app=cilium || echo "No Cilium DaemonSet found"
        echo ""
        echo "=== CNI NETWORK STATUS ==="
        # Check if nodes become Ready (primary goal)
        echo "Waiting 30 seconds for CNI to initialize networking..."
        sleep 30
        kubectl get nodes --no-headers | grep " Ready " || echo "⚠️ Some nodes still not Ready"
        echo "Node ready check complete"
      register: cni_verification
      when: not skip_cni_installation
      ignore_errors: yes

    - name: Wait for all nodes to be Ready after CNI installation
      shell: |
        echo "⏳ Waiting for all nodes to become Ready after CNI installation..."
        timeout 180 bash -c '
        while true; do
          not_ready=$(kubectl get nodes --no-headers 2>/dev/null | grep -v " Ready " | wc -l)
          total_nodes=$(kubectl get nodes --no-headers 2>/dev/null | wc -l)
          
          if [ "$not_ready" -eq 0 ] && [ "$total_nodes" -gt 0 ]; then
            echo "✅ All $total_nodes nodes are Ready!"
            break
          fi
          
          echo "Waiting for $not_ready/$total_nodes nodes to become Ready..."
          kubectl get nodes --no-headers | grep -v " Ready " || echo "All nodes appear Ready now"
          sleep 5
        done
        '
      when: 
        - not skip_cni_installation
        - (node_count.stdout | int) > 0
      register: nodes_ready_wait
      ignore_errors: yes

    - name: CNI installation results
      debug:
        msg:
          - "✅ CNI INSTALLATION VERIFICATION:"
          - "  Template optimization: {{ 'ENABLED' if (is_k8s_ready_template and cni_images_pre_pulled) else 'DISABLED' }}"
          - "  Installation method: {{ 'PRE-PULLED IMAGES' if (is_k8s_ready_template and cni_images_pre_pulled) else 'WITH IMAGE PULL' }}"
          - "  Version deployed: Cilium v{{ cni_version }}"
          - "  Time saved: {{ '~45-50s' if (is_k8s_ready_template and cni_images_pre_pulled) else 'N/A' }}"
          - "  Installation skipped: {{ 'YES' if skip_cni_installation else 'NO' }}"

  post_tasks:
    - name: Calculate phase duration
      set_fact:
        phase_end_time: "{{ ansible_date_time.epoch }}"
        phase_duration: "{{ ansible_date_time.epoch | int - phase_start_time | int }}"

    - name: Phase 5 completion summary
      debug:
        msg:
          - "📊 PHASE 5 COMPLETION (CNI Installation):"
          - "  Duration: {{ phase_duration }}s"
          - "  Template optimization: {{ 'ACTIVE' if (is_k8s_ready_template and cni_images_pre_pulled) else 'INACTIVE' }}"
          - "  Expected duration: {{ '10-15s' if (is_k8s_ready_template and cni_images_pre_pulled) else '60-90s' }}"
          - "  Images source: {{ 'TEMPLATE PRE-PULLED' if (is_k8s_ready_template and cni_images_pre_pulled) else 'DOWNLOADED DURING INSTALL' }}"
          - "  Installation status: {{ 'SKIPPED (ALREADY INSTALLED)' if skip_cni_installation else 'COMPLETED' }}"