---
# Parallel Phase 2: Container Runtime Installation (Can run on ALL nodes simultaneously)
- name: "🐳 Parallel Container Runtime Installation - Phase 2"
  hosts: k8s_cluster
  become: true
  gather_facts: true
  strategy: free  # Enable maximum parallelism
  serial: 0       # No limit on parallel execution
  
  vars:
    temp_dir: "/tmp/k8s-setup"
    
  pre_tasks:
    - name: Start timer
      set_fact:
        phase_start_time: "{{ ansible_date_time.epoch }}"
    
    # Detect OS from template and set facts BEFORE display
    - name: Set OS facts from template
      set_fact:
        detected_os_family: >-
          {%- if 'centos' in template.lower() or 'rhel' in template.lower() or 'rocky' in template.lower() or 'alma' in template.lower() -%}
          RedHat
          {%- elif 'debian' in template.lower() or 'ubuntu' in template.lower() -%}
          Debian
          {%- else -%}
          {{ ansible_os_family }}
          {%- endif -%}
        detected_distribution: >-
          {%- if 'ubuntu' in template.lower() -%}
          ubuntu
          {%- elif 'debian' in template.lower() -%}
          debian
          {%- elif 'centos' in template.lower() -%}
          centos
          {%- elif 'rocky' in template.lower() -%}
          rocky
          {%- else -%}
          {{ ansible_distribution | lower }}
          {%- endif -%}
        package_manager: >-
          {%- if 'centos' in template.lower() or 'rhel' in template.lower() or 'rocky' in template.lower() or 'alma' in template.lower() -%}
          yum
          {%- elif 'debian' in template.lower() or 'ubuntu' in template.lower() -%}
          apt
          {%- else -%}
          auto
          {%- endif -%}
    
    - name: Display parallel execution info
      debug:
        msg: |
          🐳 PARALLEL CONTAINER RUNTIME INSTALLATION
          =========================================
          Host: {{ inventory_hostname }}
          OS Family: {{ detected_os_family }}
          Package Manager: {{ package_manager }}
          Strategy: FREE (Maximum Parallelism)
          
  tasks:

    # Smart DPKG cleanup (Debian-based systems)
    - name: Check for active package managers
      shell: |
        if pgrep -f "apt|dpkg" > /dev/null; then
          echo "active"
        else
          echo "none"
        fi
      register: package_managers_status
      when: detected_os_family == "Debian"
      ignore_errors: yes
      
    - name: Wait briefly for active package operations
      wait_for:
        path: "{{ item }}"
        state: absent
        timeout: 10
      loop:
        - /var/lib/dpkg/lock
        - /var/lib/dpkg/lock-frontend
        - /var/cache/apt/archives/lock
      when: detected_os_family == "Debian" and package_managers_status.stdout == "active"
      ignore_errors: yes
      
    - name: Force unlock if stuck (emergency cleanup)
      shell: |
        # Remove lock files if they exist and no active processes
        if ! pgrep -f "apt|dpkg" > /dev/null; then
          rm -f /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend /var/cache/apt/archives/lock
        fi
      when: detected_os_family == "Debian"
      ignore_errors: yes
      
    - name: Reconfigure interrupted packages
      command: dpkg --configure -a
      when: detected_os_family == "Debian"
      ignore_errors: yes

    # Prerequisites installation (parallel by OS type)
    - name: Install prerequisites for Docker repo (RedHat-based)
      yum:
        name:
          - yum-utils
          - device-mapper-persistent-data
          - lvm2
        state: present
      when: detected_os_family == "RedHat"
      async: 120
      poll: 0
      register: rhel_prereq_job

    - name: Install prerequisites for Docker repo (Debian-based)
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: yes
        force_apt_get: yes
        dpkg_options: 'force-confold,force-confdef'
      when: detected_os_family == "Debian"
      async: 120
      poll: 0
      register: debian_prereq_job

    # Wait for prerequisites to complete FIRST
    - name: Wait for RedHat prerequisites
      async_status:
        jid: "{{ rhel_prereq_job.ansible_job_id }}"
      register: rhel_prereq_result
      until: rhel_prereq_result.finished
      retries: 60
      delay: 2
      when: rhel_prereq_job is defined and rhel_prereq_job.ansible_job_id is defined

    - name: Wait for Debian prerequisites
      async_status:
        jid: "{{ debian_prereq_job.ansible_job_id }}"
      register: debian_prereq_result
      until: debian_prereq_result.finished
      retries: 60
      delay: 2
      when: debian_prereq_job is defined and debian_prereq_job.ansible_job_id is defined

    # Repository setup (AFTER prerequisites are installed)
    - name: Add Docker repository (RedHat-based)
      yum_repository:
        name: docker-ce-stable
        description: Docker CE Stable - $basearch
        baseurl: https://download.docker.com/linux/centos/$releasever/$basearch/stable
        gpgcheck: yes
        gpgkey: https://download.docker.com/linux/centos/gpg
        enabled: yes
      when: detected_os_family == "RedHat"
      async: 30
      poll: 0
      register: rhel_repo_job

    - name: Add Docker GPG key (Debian-based)
      shell: |
        curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
      when: detected_os_family == "Debian"
      async: 30
      poll: 0
      register: debian_key_job

    - name: Add Docker repository (Debian-based)
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
        state: present
      when: detected_os_family == "Debian"
      async: 30
      poll: 0
      register: debian_repo_job

    # Wait for repository setup
    - name: Wait for RedHat repository setup
      async_status:
        jid: "{{ rhel_repo_job.ansible_job_id }}"
      register: rhel_repo_result
      until: rhel_repo_result.finished
      retries: 15
      delay: 2
      when: rhel_repo_job is defined and rhel_repo_job.ansible_job_id is defined

    - name: Wait for Debian key addition
      async_status:
        jid: "{{ debian_key_job.ansible_job_id }}"
      register: debian_key_result
      until: debian_key_result.finished
      retries: 15
      delay: 2
      when: debian_key_job is defined and debian_key_job.ansible_job_id is defined

    - name: Wait for Debian repository setup
      async_status:
        jid: "{{ debian_repo_job.ansible_job_id }}"
      register: debian_repo_result
      until: debian_repo_result.finished
      retries: 15
      delay: 2
      when: debian_repo_job is defined and debian_repo_job.ansible_job_id is defined

    # Update package cache (parallel by OS)
    - name: Update package cache (RedHat-based)
      yum:
        update_cache: yes
      when: detected_os_family == "RedHat"
      async: 60
      poll: 0
      register: rhel_update_job

    - name: Update package cache (Debian-based)
      apt:
        update_cache: yes
      when: detected_os_family == "Debian"
      async: 60
      poll: 0
      register: debian_update_job

    # Install containerd (parallel by OS)
    - name: Install containerd (RedHat-based)
      yum:
        name: containerd.io
        state: present
      when: detected_os_family == "RedHat"
      async: 180
      poll: 0
      register: rhel_containerd_job

    - name: Install containerd (Debian-based)
      apt:
        name: containerd.io
        state: present
        force_apt_get: yes
        dpkg_options: 'force-confold,force-confdef'
      when: detected_os_family == "Debian"
      async: 180
      poll: 0
      register: debian_containerd_job

    # Wait for cache updates
    - name: Wait for RedHat cache update
      async_status:
        jid: "{{ rhel_update_job.ansible_job_id }}"
      register: rhel_update_result
      until: rhel_update_result.finished
      retries: 30
      delay: 2
      when: rhel_update_job is defined and rhel_update_job.ansible_job_id is defined

    - name: Wait for Debian cache update
      async_status:
        jid: "{{ debian_update_job.ansible_job_id }}"
      register: debian_update_result
      until: debian_update_result.finished
      retries: 30
      delay: 2
      when: debian_update_job is defined and debian_update_job.ansible_job_id is defined

    # Wait for containerd installation
    - name: Wait for RedHat containerd installation
      async_status:
        jid: "{{ rhel_containerd_job.ansible_job_id }}"
      register: rhel_containerd_result
      until: rhel_containerd_result.finished
      retries: 90
      delay: 2
      when: rhel_containerd_job is defined and rhel_containerd_job.ansible_job_id is defined

    - name: Wait for Debian containerd installation
      async_status:
        jid: "{{ debian_containerd_job.ansible_job_id }}"
      register: debian_containerd_result
      until: debian_containerd_result.finished
      retries: 90
      delay: 2
      when: debian_containerd_job is defined and debian_containerd_job.ansible_job_id is defined

    # Configure containerd (can run in parallel on all nodes)
    - name: Create containerd configuration directory
      file:
        path: /etc/containerd
        state: directory
      async: 10
      poll: 0
      register: containerd_dir_job

    - name: Wait for containerd directory creation
      async_status:
        jid: "{{ containerd_dir_job.ansible_job_id }}"
      register: containerd_dir_result
      until: containerd_dir_result.finished
      retries: 10
      delay: 1
      when: containerd_dir_job is defined and containerd_dir_job.ansible_job_id is defined

    - name: Create clean containerd configuration for Kubernetes
      copy:
        content: |
          version = 2
          root = "/var/lib/containerd"
          state = "/run/containerd"
          plugin_dir = ""
          disabled_plugins = []
          required_plugins = []
          oom_score = 0

          [grpc]
            address = "/run/containerd/containerd.sock"
            tcp_address = ""
            tcp_tls_cert = ""
            tcp_tls_key = ""
            uid = 0
            gid = 0
            max_recv_message_size = 16777216
            max_send_message_size = 16777216

          [ttrpc]
            address = ""
            uid = 0
            gid = 0

          [debug]
            address = ""
            uid = 0
            gid = 0
            level = ""

          [metrics]
            address = ""
            grpc_histogram = false

          [cgroup]
            path = ""

          [timeouts]
            "io.containerd.timeout.shim.cleanup" = "5s"
            "io.containerd.timeout.shim.load" = "5s"
            "io.containerd.timeout.shim.shutdown" = "3s"
            "io.containerd.timeout.task.state" = "2s"

          [plugins]
            [plugins."io.containerd.gc.v1.scheduler"]
              pause_threshold = 0.02
              deletion_threshold = 0
              mutation_threshold = 100
              schedule_delay = "0s"
              startup_delay = "100ms"
            [plugins."io.containerd.grpc.v1.cri"]
              disable_tcp_service = true
              stream_server_address = "127.0.0.1"
              stream_server_port = "0"
              stream_idle_timeout = "4h0m0s"
              enable_selinux = false
              enable_tls_streaming = false
              max_container_log_line_size = 16384
              disable_cgroup = false
              disable_apparmor = false
              restrict_oom_score_adj = false
              max_concurrent_downloads = 3
              disable_proc_mount = false
              unset_seccomp_profile = ""
              tolerate_missing_hugetlb_controller = true
              disable_hugetlb_controller = true
              ignore_image_defined_volumes = false
              [plugins."io.containerd.grpc.v1.cri".containerd]
                snapshotter = "overlayfs"
                default_runtime_name = "runc"
                no_pivot = false
                disable_snapshot_annotations = true
                discard_unpacked_layers = false
                [plugins."io.containerd.grpc.v1.cri".containerd.runtimes]
                  [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
                    runtime_type = "io.containerd.runc.v2"
                    runtime_engine = ""
                    runtime_root = ""
                    privileged_without_host_devices = false
                    base_runtime_spec = ""
                    [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
                      SystemdCgroup = true
              [plugins."io.containerd.grpc.v1.cri".cni]
                bin_dir = "/opt/cni/bin"
                conf_dir = "/etc/cni/net.d"
                max_conf_num = 1
                conf_template = ""
              [plugins."io.containerd.grpc.v1.cri".registry]
                [plugins."io.containerd.grpc.v1.cri".registry.mirrors]
                  [plugins."io.containerd.grpc.v1.cri".registry.mirrors."docker.io"]
                    endpoint = ["https://registry-1.docker.io"]
        dest: /etc/containerd/config.toml
        backup: yes

    - name: Validate containerd configuration
      shell: containerd config dump
      register: containerd_validation
      ignore_errors: yes
      
    - name: Stop containerd before config change
      systemd:
        name: containerd
        state: stopped
      ignore_errors: yes
      
    - name: Start containerd with new configuration
      systemd:
        name: containerd
        state: started
        enabled: yes
      register: containerd_start_result
      
    - name: Check containerd service status
      systemd:
        name: containerd
      register: containerd_status
      
    - name: Show containerd logs if failed
      shell: journalctl -xeu containerd.service --no-pager -n 20
      when: containerd_start_result.failed or containerd_status.status.ActiveState != "active"
      ignore_errors: yes
      
    - name: Wait for containerd socket
      wait_for:
        path: /run/containerd/containerd.sock
        timeout: 30
      ignore_errors: yes

    - name: Verify containerd CRI service
      shell: |
        crictl info
      register: cri_check
      ignore_errors: yes
      retries: 3
      delay: 5

    - name: Install crictl if not present
      shell: |
        curl -L "https://github.com/kubernetes-sigs/cri-tools/releases/download/v1.32.0/crictl-v1.32.0-linux-amd64.tar.gz" | tar -C /usr/local/bin -xz
        chmod +x /usr/local/bin/crictl
      when: cri_check.rc != 0
      ignore_errors: yes

    - name: Configure crictl
      copy:
        content: |
          runtime-endpoint: unix:///var/run/containerd/containerd.sock
          image-endpoint: unix:///var/run/containerd/containerd.sock
          timeout: 10
          debug: false
        dest: /etc/crictl.yaml
      when: cri_check.rc != 0

  post_tasks:
    - name: Calculate phase duration
      set_fact:
        phase_end_time: "{{ ansible_date_time.epoch }}"
        phase_duration: "{{ ansible_date_time.epoch | int - phase_start_time | int }}"

    - name: Display completion status
      debug:
        msg: |
          ✅ CONTAINER RUNTIME INSTALLATION COMPLETED
          ==========================================
          Host: {{ inventory_hostname }}
          Duration: {{ phase_duration }}s
          Status: Ready for Kubernetes installation